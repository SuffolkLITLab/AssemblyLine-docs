<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%">
  <defs>
    <style>
      .term-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .term-hdr { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .term-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #8b949e; }
      .cmd-prompt { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #7ee787; font-weight: 600; }
      .cmd-text { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #f0f6fc; }
      .err-tag { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #ff7b72; }
      .warn-tag { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #d29922; }
      .info-tag { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #58a6ff; }
      .file-loc { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; fill: #79c0ff; }
      .term-desc { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; fill: #c9d1d9; }
      .term-summary { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #f0f6fc; }
    </style>
  </defs>

  <rect width="950" height="520" rx="8" class="term-bg"/>
  <rect width="950" height="38" rx="8" class="term-hdr"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="6" fill="#27c93f"/>
  <text x="80" y="24" class="term-title">terminal — python -m dayamlchecker</text>

  <!-- Command Invocation -->
  <text x="25" y="70" class="cmd-prompt">developer@workstation:~$ <tspan class="cmd-text">python3 -m dayamlchecker docassemble/MyPackage/data/questions/interview.yml</tspan></text>

  <!-- Error 1: WCAG Heading skip -->
  <text x="25" y="110" class="err-tag">ERROR [EA501]</text>
  <text x="145" y="110" class="file-loc">docassemble/MyPackage/data/questions/interview.yml:34</text>
  <text x="45" y="130" class="term-desc">Markdown heading level skipped from '##' (h2) to '####' (h4). Increment heading levels sequentially.</text>

  <!-- Warning 1: Non descriptive link -->
  <text x="25" y="170" class="warn-tag">WARN  [WA502]</text>
  <text x="145" y="170" class="file-loc">docassemble/MyPackage/data/questions/interview.yml:82</text>
  <text x="45" y="190" class="term-desc">Non-descriptive hyperlink text 'click here'. Use descriptive link text explaining destination.</text>

  <!-- Error 2: Missing field label on multi-field screen -->
  <text x="25" y="230" class="err-tag">ERROR [EA510]</text>
  <text x="145" y="230" class="file-loc">docassemble/MyPackage/data/questions/interview.yml:115</text>
  <text x="45" y="250" class="term-desc">Multi-field question screen contains field without a visible label ('no label' is only allowed on single-field screens).</text>

  <!-- Info 1: Tagged PDF feature note -->
  <text x="25" y="290" class="info-tag">INFO  [IA520]</text>
  <text x="145" y="290" class="file-loc">docassemble/MyPackage/data/questions/interview.yml:160</text>
  <text x="45" y="310" class="term-desc">Attachment 'motion_docx' is missing 'tagged pdf: True'. Enable tagged pdf for accessible PDF generation.</text>

  <!-- DOCX Finding Example -->
  <text x="25" y="350" class="warn-tag">WARN  [WA552]</text>
  <text x="145" y="350" class="file-loc">docassemble/MyPackage/data/templates/motion.docx (word/document.xml)</text>
  <text x="45" y="370" class="term-desc">Table in word/document.xml has no header row repeat marker (table begins "Certificate of Service").</text>

  <!-- Summary Line -->
  <rect x="25" y="415" width="900" height="75" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="45" y="445" class="term-summary">✖ Found 5 issues (2 errors, 2 warnings, 1 info).</text>
  <text x="45" y="470" class="cmd-text" fill="#8b949e">Run with <tspan fill="#79c0ff">--suppress EA501</tspan> or add inline <tspan fill="#7ee787"># no-dayc: EA501</tspan> in YAML to suppress specific codes.</text>
</svg>