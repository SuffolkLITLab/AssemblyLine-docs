# Based on https://docusaurus.io/docs/deployment#triggering-deployment-with-github-actions
# At times doesn't fail, even when deployment is broken
name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site and upload to github pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Clear pip cache
        run: |
          pip cache purge
      - run: pip install ruamel.yaml docspec_python==2.2.1 git+https://github.com/nonprofittechy/pydoc-markdown@escape-brackets
      - uses: actions/checkout@v7
        with:
          path: docs
      - uses: actions/checkout@v7
        with:
          repository: SuffolkLITLab/docassemble-AssemblyLine
          path: docassemble-AssemblyLine
      - uses: actions/checkout@v7
        with:
          repository: SuffolkLITLab/FormFyxer
          path: FormFyxer
      - uses: actions/checkout@v7
        with:
          repository: SuffolkLITLab/docassemble-ALToolbox
          path: docassemble-ALToolbox
      - uses: actions/checkout@v7
        with:
          repository: SuffolkLITLab/docassemble-EFSPIntegration
          path: docassemble-EFSPIntegration
      - uses: actions/checkout@v7
        with:
          repository: SuffolkLITLab/docassemble-ALDashboard
          path: docassemble-ALDashboard
      - name: Go to Docs directory
        run: |
          cd docs
          pydoc-markdown
          ./make_interview_docs.py ../docassemble-ALDashboard
          ./fix-doc-titles.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build website
        run: |
          cd docs
          npm ci
          npm run build
      - name: Upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
