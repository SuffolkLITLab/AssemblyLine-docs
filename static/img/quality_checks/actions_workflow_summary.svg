<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 16px; fill: #f0f6fc; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
      .badge-success { fill: #238636; rx: 12; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
      .table-header { fill: #21262d; stroke: #30363d; stroke-width: 1; }
      .table-header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #c9d1d9; }
      .table-row { fill: #161b22; stroke: #21262d; stroke-width: 1; }
      .table-row-alt { fill: #0d1117; stroke: #21262d; stroke-width: 1; }
      .table-cell-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; fill: #c9d1d9; }
      .table-cell-pass { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #3fb950; }
      .table-cell-warn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #d29922; }
      .artifact-card { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 6; }
      .link-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #58a6ff; font-weight: 600; }
      .annot-box { fill: rgba(187, 128, 9, 0.15); stroke: #9e6a03; stroke-width: 1; rx: 6; }
      .annot-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #f0883e; }
      .annot-msg { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #c9d1d9; }
    </style>
  </defs>

  <rect width="950" height="680" rx="8" class="bg"/>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="950" height="48" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="25" cy="24" r="10" fill="#238636"/>
  <path d="M 21 24 L 24 27 L 29 20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="45" y="29" class="header-text">Quality Checks &amp; Template Validation #142</text>
  <rect x="790" y="14" width="135" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="805" y="30" class="sub-text">main @ 4a8e2b1</text>

  <!-- Workflow Meta Header Card -->
