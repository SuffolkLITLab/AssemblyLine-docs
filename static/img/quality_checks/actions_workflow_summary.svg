    <text x="560" y="74" class="sub-text">42 tags verified</text>
    <text x="750" y="74" class="sub-text">currency, date, title_case</text>

    <rect x="0" y="84" width="900" height="28" class="table-row-alt"/>
    <text x="15" y="102" class="table-cell-text">data/templates/certificate_of_service.docx</text>
