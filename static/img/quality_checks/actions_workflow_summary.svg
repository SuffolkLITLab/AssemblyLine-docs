      <text x="65" y="72" class="sub-text" font-size="11px">Size: 245 KB • Includes index.html preview</text>
      <rect x="345" y="30" width="75" height="28" rx="4" fill="#238636"/>
      <text x="357" y="48" class="badge-text">Download</text>
    </g>

    <g transform="translate(465, 50)">
      <rect x="0" y="0" width="435" height="95" class="artifact-card"/>
      <rect x="15" y="18" width="36" height="36" rx="6" fill="#8957e5"/>
      <text x="24" y="41" font-family="sans-serif" font-size="18px" fill="#ffffff">📊</text>
      <text x="65" y="32" class="link-text" font-size="14px">jinja-validation.zip</text>
      <text x="65" y="50" class="sub-text">Detailed syntax AST reports and unknown filter warnings</text>
      <text x="65" y="72" class="sub-text" font-size="11px">Size: 18 KB • Jinja validation HTML</text>
      <rect x="345" y="30" width="75" height="28" rx="4" fill="#238636"/>
      <text x="357" y="48" class="badge-text">Download</text>
    </g>
