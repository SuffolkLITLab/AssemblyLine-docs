    <rect x="0" y="28" width="900" height="28" class="table-header"/>
    <text x="15" y="46" class="table-header-text">Document</text>
    <text x="420" y="46" class="table-header-text">Changes Detected</text>
    <text x="600" y="46" class="table-header-text">Summary Diff</text>
    <text x="780" y="46" class="table-header-text">Side-by-Side View</text>

